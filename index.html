<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓰레기 무단투기 신고</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #1f2933;
    }

    .page-header {
      background: #1f8a5b;
      color: #ffffff;
      padding: 32px 20px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.9;
    }

    main {
      width: min(100%, 720px);
      margin: 28px auto;
      padding: 0 20px;
    }

    .report-form {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.12);
      padding: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="file"],
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #cbd5d1;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      background: #ffffff;
    }

    input[type="file"] {
      padding: 10px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1f8a5b;
      box-shadow: 0 0 0 3px rgba(31, 138, 91, 0.15);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      background: #1f8a5b;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-button:hover {
      background: #176c47;
      transform: translateY(-1px);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .report-list-section {
      margin-top: 28px;
    }

    .report-list-section h2 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .report-list {
      display: grid;
      gap: 14px;
    }

    .empty-message {
      margin: 0;
      padding: 20px;
      border: 1px dashed #a8b8b0;
      border-radius: 12px;
      background: #ffffff;
      color: #607166;
      text-align: center;
    }

    .report-card {
      background: #ffffff;
      border-left: 5px solid #1f8a5b;
      border-radius: 12px;
      box-shadow: 0 5px 16px rgba(31, 41, 51, 0.1);
      padding: 18px;
    }

    .report-card.completed {
      background: #e5e7eb;
      border-left-color: #6b7280;
    }

    .report-card p {
      margin: 0 0 10px;
      line-height: 1.5;
    }

    .report-card-content {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .report-photo {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef2f0;
      flex-shrink: 0;
    }

    .report-details {
      flex: 1;
      min-width: 0;
    }

    .time-left {
      display: block;
      margin-bottom: 8px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .report-card-content {
        flex-direction: column;
      }

      .report-photo {
        width: 100%;
        height: 180px;
      }
    }

    .complete-button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #e7f5ee;
      color: #176c47;
      font-weight: 700;
      cursor: pointer;
    }

    .complete-button:disabled {
      background: #d1d5db;
      color: #4b5563;
      cursor: default;
    }

    .completed-status {
      display: none;
      margin: 12px 0 0;
      color: #374151;
      font-weight: 700;
    }

    .report-card.completed .completed-status {
      display: block;
    }

    .report-card.completed .complete-button {
      display: none;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>쓰레기 무단투기 신고</h1>
    <p>사진과 위치를 남겨 깨끗한 동네 만들기에 참여해 주세요.</p>
  </header>

  <main>
    <form class="report-form" id="report-form" action="#" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="photo">사진 첨부</label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>

      <div class="form-group">
        <label for="location">쓰레기 위치</label>
        <input type="text" id="location" name="location" placeholder="예: 해운대구 우동 123 앞" required>
      </div>

      <div class="form-group">
        <label for="description">상세 설명</label>
        <textarea id="description" name="description" placeholder="쓰레기 종류, 주변 특징, 발견 시간 등을 적어주세요." required></textarea>
      </div>

      <button class="submit-button" type="submit">신고하기</button>
    </form>

    <section class="report-list-section" aria-labelledby="report-list-title">
      <h2 id="report-list-title">신고 접수 목록</h2>
      <div class="report-list" id="report-list">
        <p class="empty-message">아직 접수된 신고가 없습니다.</p>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'trashReports';
    const API_URL = '/api/reports';
    const REPORT_EXPIRATION_MS = 24 * 60 * 60 * 1000;
    let reports = [];
    let nextReportId = 1;
    let useRemoteStorage = false;

    const reportForm = document.getElementById('report-form');
    const photoInput = document.getElementById('photo');
    const locationInput = document.getElementById('location');
    const descriptionInput = document.getElementById('description');
    const reportList = document.getElementById('report-list');

    function isReportExpired(report) {
      return Date.now() - new Date(report.created_at).getTime() >= REPORT_EXPIRATION_MS;
    }

    function getActiveReports(reportItems) {
      return reportItems.filter((report) => !isReportExpired(report));
    }

    function loadLocalReports() {
      const savedReports = localStorage.getItem(STORAGE_KEY);

      if (!savedReports) {
        return [];
      }

      const activeReports = getActiveReports(JSON.parse(savedReports));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(activeReports));
      return activeReports;
    }

    function saveLocalReports() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
    }

    function getNextReportId() {
      if (reports.length === 0) {
        return 1;
      }

      const lastReportId = Math.max(...reports.map((report) => report.id));
      return lastReportId + 1;
    }

    function getTimeLeftText(report) {
      const createdAt = new Date(report.created_at).getTime();
      const remainingMs = Math.max(0, REPORT_EXPIRATION_MS - (Date.now() - createdAt));
      const hours = Math.floor(remainingMs / (60 * 60 * 1000));
      const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));

      return `${hours}시간 ${minutes}분 남음`;
    }

    function readPhotoData() {
      const [photoFile] = photoInput.files;

      if (!photoFile) {
        return Promise.resolve('');
      }

      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.addEventListener('load', () => resolve(reader.result));
        reader.addEventListener('error', reject);
        reader.readAsDataURL(photoFile);
      });
    }

    function renderEmptyMessage() {
      reportList.innerHTML = '<p class="empty-message">아직 접수된 신고가 없습니다.</p>';
    }

    function renderReportList() {
      reportList.innerHTML = '';

      if (reports.length === 0) {
        renderEmptyMessage();
        return;
      }

      reports.forEach(renderReportCard);
      updateTimeLeftLabels();
    }

    async function loadReports() {
      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error('공유 신고 목록을 불러오지 못했습니다.');
        }

        reports = getActiveReports(await response.json());
        useRemoteStorage = true;
      } catch (error) {
        reports = loadLocalReports();
        useRemoteStorage = false;
      }

      nextReportId = getNextReportId();
      renderReportList();
    }

    async function createReport(report) {
      if (!useRemoteStorage) {
        reports.push(report);
        saveLocalReports();
        return report;
      }

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(report)
      });

      if (!response.ok) {
        throw new Error('신고를 저장하지 못했습니다.');
      }

      return response.json();
    }

    async function completeReport(report) {
      report.is_completed = true;

      if (!useRemoteStorage) {
        saveLocalReports();
        return;
      }

      await fetch(`${API_URL}/${report.id}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ is_completed: true })
      });
    }

    function removeExpiredReports() {
      const activeReports = getActiveReports(reports);

      if (activeReports.length === reports.length) {
        updateTimeLeftLabels();
        return;
      }

      reports = activeReports;

      if (!useRemoteStorage) {
        saveLocalReports();
      }

      renderReportList();
    }

    function updateTimeLeftLabels() {
      reports.forEach((report) => {
        const timeLeftLabel = reportList.querySelector(`[data-time-left-id="${report.id}"]`);

        if (timeLeftLabel) {
          timeLeftLabel.textContent = getTimeLeftText(report);
        }
      });
    }

    function renderReportCard(report) {
      const existingCard = reportList.querySelector(`[data-report-id="${report.id}"]`);

      if (existingCard) {
        return;
      }

      const reportCard = document.createElement('article');
      const cardContent = document.createElement('div');
      const reportDetails = document.createElement('div');
      const timeLeftLabel = document.createElement('small');
      const locationText = document.createElement('p');
      const descriptionText = document.createElement('p');
      const completeButton = document.createElement('button');
      const completedStatus = document.createElement('p');

      reportCard.className = report.is_completed ? 'report-card completed' : 'report-card';
      reportCard.dataset.reportId = report.id;
      cardContent.className = 'report-card-content';
      reportDetails.className = 'report-details';
      timeLeftLabel.className = 'time-left';
      timeLeftLabel.dataset.timeLeftId = report.id;
      timeLeftLabel.textContent = getTimeLeftText(report);
      locationText.innerHTML = '<strong>위치</strong>: ';
      locationText.append(report.location);
      descriptionText.innerHTML = '<strong>설명</strong>: ';
      descriptionText.append(report.description);
      completeButton.className = 'complete-button';
      completeButton.type = 'button';
      completeButton.textContent = '처리 완료';
      completeButton.disabled = report.is_completed;
      completedStatus.className = 'completed-status';
      completedStatus.textContent = '처리 완료됨';

      if (report.photoData) {
        const reportPhoto = document.createElement('img');
        reportPhoto.className = 'report-photo';
        reportPhoto.src = report.photoData;
        reportPhoto.alt = `${report.location} 신고 사진`;
        cardContent.append(reportPhoto);
      }

      completeButton.addEventListener('click', async () => {
        if (report.is_completed) {
          return;
        }

        await completeReport(report);
        reportCard.classList.add('completed');
        completeButton.disabled = true;
      });

      reportDetails.append(timeLeftLabel, locationText, descriptionText, completeButton, completedStatus);
      cardContent.append(reportDetails);
      reportCard.append(cardContent);
      reportList.appendChild(reportCard);
    }

    reportForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (reportForm.dataset.submitting === 'true') {
        return;
      }

      reportForm.dataset.submitting = 'true';

      const location = locationInput.value.trim();
      const description = descriptionInput.value.trim();

      if (!location || !description) {
        reportForm.dataset.submitting = 'false';
        return;
      }

      const report = {
        id: nextReportId,
        location,
        description,
        photoData: await readPhotoData(),
        created_at: new Date().toISOString(),
        is_completed: false
      };

      const savedReport = await createReport(report);

      if (useRemoteStorage) {
        reports.push(savedReport);
      }

      renderReportCard(savedReport);
      nextReportId = getNextReportId();
      reportForm.reset();

      setTimeout(() => {
        reportForm.dataset.submitting = 'false';
      }, 0);
    });

    loadReports();
    setInterval(removeExpiredReports, 60 * 1000);
  </script>
</body>
</html>
