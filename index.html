<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓰레기 무단투기 신고</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #1f2933;
    }

    .page-header {
      background: #1f8a5b;
      color: #ffffff;
      padding: 32px 20px;
      text-align: center;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .page-header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.9;
    }

    main {
      width: min(100%, 720px);
      margin: 28px auto;
      padding: 0 20px;
    }

    .report-form {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.12);
      padding: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="file"],
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #cbd5d1;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      background: #ffffff;
    }

    input[type="file"] {
      padding: 10px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1f8a5b;
      box-shadow: 0 0 0 3px rgba(31, 138, 91, 0.15);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      background: #1f8a5b;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-button:hover {
      background: #176c47;
      transform: translateY(-1px);
    }

    .submit-button:active {
      transform: translateY(0);
    }

    .report-list-section {
      margin-top: 28px;
    }

    .report-list-section h2 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .report-list {
      display: grid;
      gap: 14px;
    }

    .empty-message {
      margin: 0;
      padding: 20px;
      border: 1px dashed #a8b8b0;
      border-radius: 12px;
      background: #ffffff;
      color: #607166;
      text-align: center;
    }

    .report-card {
      background: #ffffff;
      border-left: 5px solid #1f8a5b;
      border-radius: 12px;
      box-shadow: 0 5px 16px rgba(31, 41, 51, 0.1);
      padding: 18px;
    }

    .report-card.completed {
      background: #e5e7eb;
      border-left-color: #6b7280;
    }

    .report-card p {
      margin: 0 0 10px;
      line-height: 1.5;
    }

    .complete-button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #e7f5ee;
      color: #176c47;
      font-weight: 700;
      cursor: pointer;
    }

    .complete-button:disabled {
      background: #d1d5db;
      color: #4b5563;
      cursor: default;
    }

    .completed-status {
      display: none;
      margin: 12px 0 0;
      color: #374151;
      font-weight: 700;
    }

    .report-card.completed .completed-status {
      display: block;
    }

    .report-card.completed .complete-button {
      display: none;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>쓰레기 무단투기 신고</h1>
    <p>사진과 위치를 남겨 깨끗한 동네 만들기에 참여해 주세요.</p>
  </header>

  <main>
    <form class="report-form" id="report-form" action="#" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="photo">사진 첨부</label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>

      <div class="form-group">
        <label for="location">쓰레기 위치</label>
        <input type="text" id="location" name="location" placeholder="예: 해운대구 우동 123 앞" required>
      </div>

      <div class="form-group">
        <label for="description">상세 설명</label>
        <textarea id="description" name="description" placeholder="쓰레기 종류, 주변 특징, 발견 시간 등을 적어주세요." required></textarea>
      </div>

      <button class="submit-button" type="submit">신고하기</button>
    </form>

    <section class="report-list-section" aria-labelledby="report-list-title">
      <h2 id="report-list-title">신고 접수 목록</h2>
      <div class="report-list" id="report-list">
        <p class="empty-message">아직 접수된 신고가 없습니다.</p>
      </div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'trashReports';
    let reports = loadReports();
    let nextReportId = getNextReportId();

    const reportForm = document.getElementById('report-form');
    const locationInput = document.getElementById('location');
    const descriptionInput = document.getElementById('description');
    const reportList = document.getElementById('report-list');

    function loadReports() {
      const savedReports = localStorage.getItem(STORAGE_KEY);

      if (!savedReports) {
        return [];
      }

      return JSON.parse(savedReports);
    }

    function saveReports() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
    }

    function getNextReportId() {
      if (reports.length === 0) {
        return 1;
      }

      const lastReportId = Math.max(...reports.map((report) => report.id));
      return lastReportId + 1;
    }

    function renderReportCard(report) {
      const existingCard = reportList.querySelector(`[data-report-id="${report.id}"]`);

      if (existingCard) {
        return;
      }

      const emptyMessage = reportList.querySelector('.empty-message');

      if (emptyMessage) {
        emptyMessage.remove();
      }

      const reportCard = document.createElement('article');
      const locationText = document.createElement('p');
      const descriptionText = document.createElement('p');
      const completeButton = document.createElement('button');
      const completedStatus = document.createElement('p');

      reportCard.className = report.is_completed ? 'report-card completed' : 'report-card';
      reportCard.dataset.reportId = report.id;
      locationText.innerHTML = '<strong>위치</strong>: ';
      locationText.append(report.location);
      descriptionText.innerHTML = '<strong>설명</strong>: ';
      descriptionText.append(report.description);
      completeButton.className = 'complete-button';
      completeButton.type = 'button';
      completeButton.textContent = '처리 완료';
      completeButton.disabled = report.is_completed;
      completedStatus.className = 'completed-status';
      completedStatus.textContent = '처리 완료됨';

      completeButton.addEventListener('click', () => {
        if (report.is_completed) {
          return;
        }

        report.is_completed = true;
        saveReports();
        reportCard.classList.add('completed');
        completeButton.disabled = true;
      });

      reportCard.append(locationText, descriptionText, completeButton, completedStatus);
      reportList.appendChild(reportCard);
    }

    reports.forEach(renderReportCard);

    reportForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (reportForm.dataset.submitting === 'true') {
        return;
      }

      reportForm.dataset.submitting = 'true';

      const location = locationInput.value.trim();
      const description = descriptionInput.value.trim();

      if (!location || !description) {
        reportForm.dataset.submitting = 'false';
        return;
      }

      const report = {
        id: nextReportId,
        location,
        description,
        is_completed: false
      };

      reports.push(report);
      saveReports();
      renderReportCard(report);
      nextReportId += 1;
      reportForm.reset();

      setTimeout(() => {
        reportForm.dataset.submitting = 'false';
      }, 0);
    });
  </script>
</body>
</html>
